<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASO Compass report</title>
  </head>
  <body>
    <main class="results-view" aria-live="polite">Preparing the report…</main>
    <script>
      (() => {
        const parameters = new URLSearchParams(window.location.search);
        const requestId = parameters.get("request");
        const requestedTitle = parameters.get("title") || "ASO-Compass_report";
        document.title = requestedTitle;

        window.addEventListener("message", async (event) => {
          const payload = event.data;
          if (
            event.origin !== window.location.origin
            || event.source !== window.opener
            || payload?.type !== "aso-print-render"
            || payload?.requestId !== requestId
          ) return;

          document.title = payload.title || requestedTitle;
          const base = document.createElement("base");
          base.href = payload.baseHref;
          document.head.prepend(base);
          const template = document.createElement("template");
          template.innerHTML = payload.headHtml.join("");
          document.head.append(template.content);
          const main = document.createElement("main");
          main.className = "results-view";
          main.innerHTML = payload.reportHtml;
          document.body.replaceChildren(main);

          const stylesReady = [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => {
            if (link.sheet) return Promise.resolve();
            return new Promise((resolve) => {
              link.addEventListener("load", resolve, { once: true });
              link.addEventListener("error", resolve, { once: true });
            });
          });
          await Promise.all(stylesReady);
          await document.fonts.ready;
          await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          window.addEventListener("afterprint", () => window.close(), { once: true });
          window.focus();
          window.print();
        });

        if (window.opener && requestId) {
          window.opener.postMessage({ type: "aso-print-ready", requestId }, window.location.origin);
        }
      })();
    </script>
  </body>
</html>
