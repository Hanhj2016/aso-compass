[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aso-compass-api"
version = "0.1.0"
description = "Deterministic ASO Compass research API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=3.35,<4",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/data/examples/als-v4.1.json" = "app/data/examples/als-v4.1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]
